<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro to Python Quiz – 60 Items</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
:root{--bg:#0e1424;--panel:#161e36;--line:#2a3558;--ink:#e8ecf8;--mute:#8f9bbd;--blue:#4b8bbe;--yellow:#ffd43b;--ok:#3ddc97;--bad:#ff5d73}
@media(prefers-color-scheme:light){:root{--bg:#eef2fb;--panel:#fff;--line:#d3dbf0;--ink:#16203d;--mute:#5b6786}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px/1.55 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 0,#1d2d5c33,transparent 45%),radial-gradient(circle at 90% 100%,#ffd43b1f,transparent 40%),var(--bg);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:26px 26px;opacity:.5;pointer-events:none}
main{position:relative;max-width:760px;margin:0 auto;padding:28px 18px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 18px 50px #0004}
h1{font-size:clamp(28px,6vw,42px);line-height:1.1;margin:14px 0 10px}
h1 span{background:linear-gradient(90deg,var(--blue),var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent}
p.lead{color:var(--mute);margin:0 0 20px}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--mute)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 22px;font-weight:700;color:#10172e;background:linear-gradient(135deg,var(--yellow),#ffb703);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 20px #ffd43b44}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:8px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--yellow));transition:width .4s}
.cell{display:flex;gap:12px;background:#0b1020;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.cell b{font:600 13px ui-monospace,Consolas,monospace;color:#7aa2f7;white-space:nowrap;padding-top:3px}
.cell div{color:#e8ecf8;font-size:18px;font-weight:600}
.ref{background:#0b1020;border:1px dashed var(--yellow);border-radius:10px;padding:10px 14px 12px;margin-bottom:18px}
.ref small{color:var(--yellow);font-weight:600}
.ref pre{margin:6px 0 0;color:#c9d6ff;font:14px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-x:auto}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:0 0 10px;padding:13px 16px;font-weight:500;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:12px}
.opt:hover:not(:disabled){border-color:var(--blue);box-shadow:none;background:#4b8bbe1a}
.opt i{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 13px ui-monospace,monospace;font-style:normal;background:var(--line)}
.opt.ok{border-color:var(--ok);background:#3ddc9722}.opt.ok i{background:var(--ok);color:#06251a}
.opt.no{border-color:var(--bad);background:#ff5d7322}.opt.no i{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;transform:none}
.why{display:none;margin:14px 0;padding:12px 14px;border-radius:10px;background:#4b8bbe1f;border-left:4px solid var(--yellow);font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ring{position:relative;width:190px;height:190px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring strong{font-size:44px;line-height:1}
.center{text-align:center}
.rev{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.rev small{color:var(--mute);display:block}
.rev em{color:var(--ok);font-style:normal;font-weight:600}.rev s{color:var(--bad)}
.float{position:absolute;right:-6px;top:-6px;font-size:54px;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px) rotate(6deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hide{display:none}
</style>
</head>

  if(locked)return;locked=true;const d=Q[order[i]];const right=b.dataset.t===d[1];
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.t===d[1])x.classList.add("ok")});
  if(right)score++;else{b.classList.add("no");miss.push({q:d[0],you:b.dataset.t,ans:d[1],why:d[5]})}
  $("sc").textContent="Score: "+score;
  $("why").style.display="block";$("why").textContent=(right?"✅ Correct! ":"❌ Not quite. ")+d[5];
  $("next").textContent=i===59?"See my score":"Next";$("next").classList.remove("hide");$("next").focus();
}
function next(){if(i===59)finish();else{i++;render()}}
function finish(){
  show("end");const p=Math.round(score/60*100);
  const b=getBest();if(!b||score>+b)setBest(score);showBest();
  $("big").textContent=score+"/60";$("pct").textContent=p+"%";
  const m=p>=90?["Outstanding! 🏆","You've mastered this notebook."]:p>=75?["Great job! 🎉","Solid understanding, just a few gaps to polish."]:p>=60?["Good effort! 👍","You passed. Review the missed items and try again."]:["Keep practicing! 💪","Check the review below, then retake the quiz."];
  $("msg").textContent=m[0];$("sub").textContent=m[1]+" Missed: "+miss.length+".";
  const arc=$("arc");arc.style.strokeDashoffset=515;setTimeout(()=>arc.style.strokeDashoffset=515*(1-score/60),60);
  const r=$("review");r.classList.add("hide");$("tog").textContent="Show review";r.innerHTML="";
  if(!miss.length)r.innerHTML="<p class='lead center'>Perfect score, nothing to review! 🎯</p>";
  miss.forEach(x=>{const e=document.createElement("div");e.className="rev";
    const a=document.createElement("small");a.textContent=x.q;
    const y=document.createElement("div");y.innerHTML="Your answer: <s></s><br>Correct: <em></em>";
    y.querySelector("s").textContent=x.you;y.querySelector("em").textContent=x.ans;
    const w=document.createElement("small");w.textContent=x.why;e.append(a,y,w);r.appendChild(e)});
  window.scrollTo({top:0,behavior:"smooth"});
}
$("go").onclick=start;$("again").onclick=start;$("next").onclick=next;
$("tog").onclick=()=>{const r=$("review");const h=r.classList.toggle("hide");$("tog").textContent=h?"Show review":"Hide review"};
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hide"))return;
  if(e.key>="1"&&e.key<="4"){const b=document.querySelectorAll(".opt")[+e.key-1];if(b&&!locked)pick(b)}
  else if(e.key==="Enter"&&locked){e.preventDefault();next()}
});
showBest();
</script>
